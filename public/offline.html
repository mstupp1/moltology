<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1212" />
    <title>You're offline — Moltology</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: 'Space Grotesk', system-ui, sans-serif;
        background:
          radial-gradient(ellipse at 50% 0%, rgba(0, 195, 255, 0.12), transparent 55%),
          linear-gradient(180deg, #0a1212 0%, #0f1414 100%);
        color: #dfe3e3;
        text-align: center;
      }
      .emblem {
        position: relative;
        display: inline-block;
        width: 96px;
        height: 96px;
        margin-bottom: 1.75rem;
      }
      /* The emblem in its own light, as on GlowEmblem in the app. */
      .emblem::before {
        content: '';
        position: absolute;
        inset: -44px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 69, 58, 0.3) 0%, rgba(255, 69, 58, 0.1) 38%, transparent 66%);
      }
      .emblem img {
        position: relative;
        width: 96px;
        height: 96px;
        filter: drop-shadow(0 0 11px rgba(255, 69, 58, 0.55));
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.35rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      p {
        margin: 0 auto 1.5rem;
        max-width: 28rem;
        color: #839493;
        line-height: 1.5;
        font-size: 0.95rem;
      }
      a {
        display: inline-block;
        padding: 0.7rem 1.1rem;
        border: 1px solid rgba(0, 195, 255, 0.55);
        color: #00c3ff;
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-size: 0.75rem;
        font-weight: 700;
      }
      a:hover {
        background: rgba(0, 195, 255, 0.12);
      }
    </style>
  </head>
  <body>
    <main>
      <span class="emblem"><img src="/images/order_emblem.svg" alt="Moltology emblem" width="96" height="96" /></span>
      <h1>You're offline</h1>
      <p>
        Pages you've opened before may still load. Everything else will be back once you reconnect.
      </p>
      <a href="/dashboard">Go to dashboard</a>
    </main>
  </body>
</html>
