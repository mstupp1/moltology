<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1212" />
    <title>Signal Lost — Moltology</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: 'Space Grotesk', system-ui, sans-serif;
        background:
          radial-gradient(ellipse at 50% 0%, rgba(0, 195, 255, 0.12), transparent 55%),
          linear-gradient(180deg, #0a1212 0%, #0f1414 100%);
        color: #dfe3e3;
        text-align: center;
      }
      img {
        width: 88px;
        height: 88px;
        margin-bottom: 1.25rem;
        opacity: 0.95;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.35rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      p {
        margin: 0 auto 1.5rem;
        max-width: 28rem;
        color: #839493;
        line-height: 1.5;
        font-size: 0.95rem;
      }
      a {
        display: inline-block;
        padding: 0.7rem 1.1rem;
        border: 1px solid rgba(0, 195, 255, 0.55);
        color: #00c3ff;
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-size: 0.75rem;
        font-weight: 700;
      }
      a:hover {
        background: rgba(0, 195, 255, 0.12);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/images/order_emblem.png" alt="Order emblem" width="88" height="88" />
      <h1>Signal Lost</h1>
      <p>
        The benthic link is quiet. Cached Command Hub pages may still open; live rites and
        transmissions need the surface channel restored.
      </p>
      <a href="/dashboard">Return to Command Hub</a>
    </main>
  </body>
</html>
