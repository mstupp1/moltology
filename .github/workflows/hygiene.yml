name: Repo Hygiene (Asset Budget & Typecheck)

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  hygiene:
    name: Asset Budget Guard + Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Enforce Asset Budget
        run: npm run assets:check

      - name: Typecheck
        run: npm run typecheck
